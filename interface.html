<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #01040a; --c: #00e5ff; --c2: #0077ff; --txt: #bff6ff; --dim: #3f7488;
    --line: rgba(0, 229, 255, .22); --panel: rgba(0, 20, 32, .6); --warn: #ffb000; --ok: #2bff9e; --err: #ff3b5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden;
    font-family: "Share Tech Mono", Consolas, monospace; }
  #fundo { position: fixed; inset: 0; width: 100%; height: 100%; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  .hud { position: fixed; font-size: 12px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; line-height: 1.8; }
  .hud b { color: var(--c); font-weight: normal; }
  #tl { top: 22px; left: 28px; } #tr { top: 22px; right: 28px; text-align: right; }
  #bl { bottom: 22px; left: 28px; }
  .marca { font-family: Orbitron, sans-serif; font-size: 22px; letter-spacing: .5em; color: var(--c);
    text-shadow: 0 0 12px var(--c); }
  .canto { position: fixed; width: 34px; height: 34px; border: 2px solid var(--c); opacity: .6; }
  .canto.a { top: 10px; left: 10px; border-right: 0; border-bottom: 0; } .canto.b { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
  .canto.c { bottom: 10px; left: 10px; border-right: 0; border-top: 0; } .canto.d { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
  main { position: relative; height: 100%; display: grid; grid-template-columns: 1fr minmax(320px, 400px); }
  #palco { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #olho { width: min(64vh, 88%); aspect-ratio: 1; }
  #estado { font-family: Orbitron, sans-serif; font-size: 14px; letter-spacing: .6em; color: var(--c); text-shadow: 0 0 8px var(--c);
    margin-top: 6px; text-transform: uppercase; }
  #legenda { margin-top: 14px; max-width: 72%; text-align: center; font-size: 19px; line-height: 1.5; min-height: 58px; color: var(--txt); }
  aside { position: relative; margin: 70px 22px 22px 0; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; padding: 14px; min-height: 0;
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  aside h2 { font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: .4em; color: var(--c); margin: 4px 0 10px; font-weight: 500; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  #log::-webkit-scrollbar { width: 4px; } #log::-webkit-scrollbar-thumb { background: var(--line); }
  .msg { padding: 8px 10px; font-size: 13px; line-height: 1.45; border-left: 2px solid var(--c); background: rgba(0, 229, 255, .05); }
  .msg.eu { border-left-color: var(--c2); background: rgba(0, 119, 255, .1); }
  .msg.eu::before { content: "VOCÊ › "; color: var(--c2); } .msg.ia::before { content: "ATLAS › "; color: var(--c); }
  .proj { font-size: 11px; padding: 6px 8px; margin-bottom: 6px; border: 1px solid var(--line); }
  .proj b { color: var(--c); font-weight: normal; } .proj .st { float: right; color: var(--warn); }
  .proj .st.concluido { color: var(--ok); } .proj .st.falhou, .proj .st.interrompido { color: var(--err); }
  .proj .arqs { color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.acao { font-size: 11px; color: var(--warn); border-left-color: var(--warn); background: rgba(255, 176, 0, .06); }
  .linha { display: flex; gap: 6px; margin-bottom: 8px; }
  select, input { flex: 1; min-width: 0; background: rgba(0,0,0,.5); color: var(--txt); border: 1px solid var(--line); padding: 8px;
    font: 12px "Share Tech Mono", monospace; outline: none; }
  input:focus, select:focus { border-color: var(--c); }
  button { background: transparent; border: 1px solid var(--c); color: var(--c); padding: 6px 10px; cursor: pointer;
    font: 11px Orbitron, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
  button.on { background: var(--c); color: var(--bg); box-shadow: 0 0 12px var(--c); }
  #medidor { height: 4px; background: rgba(0,0,0,.5); margin-bottom: 10px; }
  #barra { height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c)); box-shadow: 0 0 8px var(--c); }
  video { display: none; width: 100%; border: 1px solid var(--line); margin-bottom: 10px; transform: scaleX(-1); filter: saturate(.6) hue-rotate(-10deg); }
  video.on { display: block; }
  form { display: flex; gap: 6px; margin-top: 10px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 45%; } aside { margin: 0 12px 12px; } .hud { display: none; } }
</style>
</head>
<body>
<canvas id="fundo"></canvas>
<div class="canto a"></div><div class="canto b"></div><div class="canto c"></div><div class="canto d"></div>
<div class="hud" id="tl"><div class="marca" id="nome">ATLAS</div><div>sistema <b>online</b> · núcleo <b id="modelo">—</b></div></div>
<div class="hud" id="tr"><div id="relogio"></div><div id="data"></div></div>
<div class="hud" id="bl"><div>áudio <b id="hudMic">—</b></div><div>visão <b id="hudCam">off</b></div><div>escuta <b id="hudEscuta">automática</b></div></div>
<main>
  <section id="palco">
    <canvas id="olho" width="900" height="900"></canvas>
    <div id="estado">inicializando</div>
    <div id="legenda"></div>
  </section>
  <aside>
    <h2>// CONTROLE</h2>
    <div class="linha"><select id="mics" title="Microfone"><option>microfone…</option></select></div>
    <div id="medidor"><div id="barra"></div></div>
    <div class="linha">
      <button id="escuta" class="on">Escuta</button>
      <button id="mudo" class="on">Voz</button>
      <button id="cam">Visão</button>
      <button id="minhaVoz" title="Ensinar o Atlas a reconhecer só a sua voz">Minha voz</button>
    </div>
    <video id="video" autoplay muted playsinline></video>
    <div id="painelProjetos" hidden><h2>// PROJETOS</h2><div id="projetos"></div></div>
    <h2>// REGISTRO</h2>
    <div id="log"></div>
    <form id="form"><input id="txt" placeholder="digite um comando…" autocomplete="off"><button>›</button></form>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let estado = "inicializando", nivel = 0, nomeIA = "Atlas", usuario = "";
let escutaAtiva = true, vozLigada = true, ocupado = false, falando = false, camLigada = false, fimFala = 0;
let ultimaConversa = 0;            // depois de falar com ele, segue a conversa sem precisar dizer o nome
const JANELA_CONVERSA = 25000;

function setEstado(e) { estado = e; $("estado").textContent = e; }
function log(texto, tipo) {
  const d = document.createElement("div"); d.className = "msg " + tipo; d.textContent = texto;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
setInterval(() => {
  const d = new Date();
  $("relogio").textContent = d.toLocaleTimeString("pt-BR");
  $("data").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
}, 1000);

// ================= fundo: grade hexagonal + partículas =================
const fd = $("fundo"), fx = fd.getContext("2d");
let pontos = [];
function redimensionar() {
  fd.width = innerWidth; fd.height = innerHeight;
  pontos = Array.from({ length: 70 }, () => ({ x: Math.random() * fd.width, y: Math.random() * fd.height, v: .2 + Math.random() * .6 }));
}
addEventListener("resize", redimensionar); redimensionar();
function fundo(t) {
  fx.fillStyle = "#01040a"; fx.fillRect(0, 0, fd.width, fd.height);
  const g = fx.createRadialGradient(fd.width * .4, fd.height / 2, 0, fd.width * .4, fd.height / 2, fd.width * .6);
  g.addColorStop(0, "rgba(0,90,140,.25)"); g.addColorStop(1, "rgba(0,0,0,0)");
  fx.fillStyle = g; fx.fillRect(0, 0, fd.width, fd.height);
  const R = 26, h = R * Math.sqrt(3);
  fx.strokeStyle = "rgba(0,229,255,.05)"; fx.lineWidth = 1;
  for (let y = -h; y < fd.height + h; y += h) for (let x = -R * 3, i = 0; x < fd.width + R * 3; x += R * 3, i++) {
    for (const [ox, oy] of [[0, 0], [R * 1.5, h / 2]]) {
      fx.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; fx.lineTo(x + ox + R * Math.cos(a), y + oy + R * Math.sin(a)); }
      fx.closePath(); fx.stroke();
    }
  }
  fx.fillStyle = "rgba(0,229,255,.5)";
  for (const p of pontos) { p.y -= p.v; if (p.y < 0) { p.y = fd.height; p.x = Math.random() * fd.width; } fx.fillRect(p.x, p.y, 1.5, 1.5); }
  // linha de varredura
  const sy = (t * 60) % (fd.height + 200) - 100;
  const sg = fx.createLinearGradient(0, sy - 60, 0, sy);
  sg.addColorStop(0, "rgba(0,229,255,0)"); sg.addColorStop(1, "rgba(0,229,255,.06)");
  fx.fillStyle = sg; fx.fillRect(0, sy - 60, fd.width, 60);
}

// ================= olho cibernético =================
const cv = $("olho"), cx = cv.getContext("2d");
const CORES = { pronto: [0,229,255], escutando: [0,229,255], ouvindo: [43,255,158], transcrevendo: [43,255,158],
  pensando: [255,176,0], falando: [0,229,255], erro: [255,59,92], inicializando: [0,119,255], pausado: [63,116,136] };
let cor = [0,229,255], olhoX = 0, olhoY = 0, alvoX = 0, alvoY = 0, t = 0;
addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  alvoX = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width / 2) / r.width));
  alvoY = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height / 2) / r.height));
});
setInterval(() => { if (Math.random() < .5) { alvoX = Math.random() * .8 - .4; alvoY = Math.random() * .5 - .25; } }, 3000);

function arco(c, r, a0, a1, w, a) { cx.beginPath(); cx.arc(c, c, r, a0, a1); cx.lineWidth = w; cx.strokeStyle = rgba(a); cx.stroke(); }
function rgba(a) { return `rgba(${cor.map(Math.round).join(",")},${a})`; }

function olho() {
  const W = cv.width, c = W / 2;
  const alvo = CORES[estado] || CORES.pronto;
  cor = cor.map((v, i) => v + (alvo[i] - v) * .07);
  const fala = falando ? (Math.sin(t * 20) * .5 + .5) * .5 + Math.random() * .3 : 0;
  const e = Math.min(1, nivel * 4 + fala + (estado === "pensando" ? .3 : 0));
  cx.clearRect(0, 0, W, W);
  cx.shadowBlur = 18; cx.shadowColor = rgba(.8);

  // anel externo de marcações
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2 + t * .05, longo = i % 10 === 0;
    const r1 = W * .44, r2 = r1 - (longo ? W * .03 : W * .012);
    cx.beginPath(); cx.moveTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1); cx.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2);
    cx.lineWidth = longo ? 3 : 1.5; cx.strokeStyle = rgba(longo ? .8 : .35); cx.stroke();
  }
  // arcos segmentados girando em sentidos opostos
  for (let i = 0; i < 3; i++) { const a = t * .6 + i * Math.PI * 2 / 3; arco(c, W * .39, a, a + 1.4, 6, .75); }
  for (let i = 0; i < 6; i++) { const a = -t * 1.1 + i * Math.PI / 3; arco(c, W * .355, a, a + .7, 3, .5); }
  arco(c, W * .33, 0, Math.PI * 2, 1, .25);
  // espectro de áudio em volta
  for (let i = 0; i < 90; i++) {
    const a = i / 90 * Math.PI * 2 - Math.PI / 2;
    const amp = (Math.sin(i * .7 + t * 8) * .5 + .5) * e * W * .05 + W * .004;
    const r1 = W * .30, r2 = r1 + amp;
    cx.beginPath(); cx.moveTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1); cx.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2);
    cx.lineWidth = 3; cx.strokeStyle = rgba(.4 + e * .5); cx.stroke();
  }
  // varredura radar
  const va = t * 1.4;
  const sg = cx.createConicGradient(va, c, c);
  sg.addColorStop(0, rgba(.22)); sg.addColorStop(.12, rgba(0)); sg.addColorStop(1, rgba(0));
  cx.shadowBlur = 0; cx.fillStyle = sg; cx.beginPath(); cx.arc(c, c, W * .29, 0, Math.PI * 2); cx.fill();
  cx.shadowBlur = 18;

  // íris hexagonal que olha em volta
  olhoX += (alvoX - olhoX) * .06; olhoY += (alvoY - olhoY) * .06;
  const ix = c + olhoX * W * .07, iy = c + olhoY * W * .07;
  const piscar = (t % 5) < .1 ? .08 : 1;
  cx.save(); cx.translate(ix, iy); cx.scale(1, piscar);
  for (let k = 0; k < 3; k++) {
    const R = W * (.17 - k * .04) * (1 + e * .06), giro = t * (k % 2 ? -.4 : .3);
    cx.beginPath();
    for (let j = 0; j <= 6; j++) { const a = giro + j * Math.PI / 3; cx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
    cx.lineWidth = k === 0 ? 3 : 2; cx.strokeStyle = rgba(.85 - k * .2); cx.stroke();
  }
  // pupila
  const pr = W * (.05 + e * .025);
  const pg = cx.createRadialGradient(0, 0, 0, 0, 0, pr * 1.8);
  pg.addColorStop(0, "rgba(255,255,255,1)"); pg.addColorStop(.35, rgba(1)); pg.addColorStop(1, rgba(0));
  cx.fillStyle = pg; cx.beginPath(); cx.arc(0, 0, pr * 1.8, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = "#01040a"; cx.beginPath(); cx.arc(0, 0, pr * .45, 0, Math.PI * 2); cx.fill();
  cx.restore();

  // mira
  cx.shadowBlur = 0; cx.strokeStyle = rgba(.5); cx.lineWidth = 2;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    cx.beginPath(); cx.moveTo(c + dx * W * .2, c + dy * W * .2); cx.lineTo(c + dx * W * .26, c + dy * W * .26); cx.stroke();
  }
}
function quadro() { t += .016; fundo(t); olho(); requestAnimationFrame(quadro); }
quadro();

// ================= voz =================
let vozPt = null;
function escolherVoz() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("pt"));
  vozPt = vs.find(v => /natural|online/i.test(v.name) && /antonio|donato|fabio|humberto/i.test(v.name))
       || vs.find(v => /natural|online/i.test(v.name)) || vs.find(v => /br/i.test(v.lang)) || vs[0] || null;
}
speechSynthesis.onvoiceschanged = escolherVoz; escolherVoz();
// Voz robótica: áudio do servidor passa por modulação em anel + eco metálico curto.
async function falar(texto) {
  if (!vozLigada || !texto) return;
  falasRecentes = [...falasRecentes.slice(-4), texto];
  try {
    audioCtx = audioCtx || new AudioContext(); await audioCtx.resume();
    // Gera o áudio de todas as frases em paralelo e já começa a tocar a primeira.
    const frases = texto.match(/[^.!?…]+[.!?…]*/g)?.map(f => f.trim()).filter(Boolean) || [texto];
    const pedidos = frases.map(f => fetch("/falar", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: f }) }).then(async r => {
        if (!r.ok) throw new Error("tts");
        return { rob: parseFloat(r.headers.get("X-Robotico") ?? ".25"), buf: await audioCtx.decodeAudioData(await r.arrayBuffer()) };
      }));
    falando = true; setEstado("falando");
    cancelarFala = false;
    for (const p of pedidos) { if (cancelarFala) break; await tocarFrase(await p); }
    falando = false; fimFala = performance.now();
  } catch { falando = false; return falarNavegador(texto); }
}
let cancelarFala = false, fonteAtual = null;
function pararDeFalar() {
  cancelarFala = true; speechSynthesis.cancel();
  try { fonteAtual && fonteAtual.stop(); } catch {}
}
async function tocarFrase({ rob, buf }) {
  rob = Math.max(0, Math.min(1, rob));
  {
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const anel = audioCtx.createGain(); anel.gain.value = 0;
    const osc = audioCtx.createOscillator(); osc.frequency.value = 40 + rob * 30; osc.connect(anel.gain);
    const seco = audioCtx.createGain(); seco.gain.value = 1 - rob * .5;
    const molhado = audioCtx.createGain(); molhado.gain.value = rob * .8;
    const eco = audioCtx.createDelay(); eco.delayTime.value = .008 + rob * .006;
    const retorno = audioCtx.createGain(); retorno.gain.value = rob * .45;
    const filtro = audioCtx.createBiquadFilter(); filtro.type = "highpass"; filtro.frequency.value = 80 + rob * 100;
    src.connect(seco); src.connect(anel); anel.connect(molhado);
    for (const n of [seco, molhado]) n.connect(eco), n.connect(filtro);
    eco.connect(retorno); retorno.connect(eco); retorno.connect(filtro);
    filtro.connect(audioCtx.destination);
    osc.start(); src.start();
    fonteAtual = src;
    await new Promise(ok => src.onended = ok);
    fonteAtual = null;
    osc.stop();
  }
}
function falarNavegador(texto) {
  return new Promise(ok => {
    if (!vozLigada || !texto) return ok();
    const u = new SpeechSynthesisUtterance(texto);
    if (vozPt) u.voice = vozPt; u.lang = "pt-BR"; u.rate = 1.05;
    u.onstart = () => { falando = true; setEstado("falando"); };
    u.onend = u.onerror = () => { falando = false; fimFala = performance.now(); ok(); };
    speechSynthesis.speak(u);
  });
}

// ================= escuta automática =================
// Captura PCM direto do microfone, detecta quando você fala e envia 16 kHz ao servidor.
let stream, audioCtx, fonte, proc, micId = null;
try { micId = localStorage.getItem("atlasMic"); if (localStorage.getItem("atlasMicAuto") !== "3") { micId = null; localStorage.setItem("atlasMicAuto", "3"); } } catch {}
let gravando = false, buffers = [], preRoll = [], falouMs = 0, silencioMs = 0;
const LIMIAR = 0.02;

async function listarMics() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
  $("mics").innerHTML = devs.map(d => `<option value="${d.deviceId}">${d.label || "microfone"}</option>`).join("");
}
$("mics").onchange = () => { micId = $("mics").value; try { localStorage.setItem("atlasMic", micId); } catch {} ligarMic(); };

async function ligarMic() {
  if (stream) { stream.getTracks().forEach(tr => tr.stop()); proc && proc.disconnect(); }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      deviceId: micId ? { exact: micId } : undefined, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) {
      setEstado("erro"); $("hudMic").textContent = "bloqueado";
      const m = "Sem acesso ao microfone (" + e.name + "). Verifique a permissão do microfone.";
      log(m, "acao"); $("legenda").textContent = m; return;
    }
  }
  await listarMics();
  // Sem escolha salva: prefere o headset (perto da boca) em vez do microfone da webcam
  if (!micId) {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
    const melhor = devs.find(d => /headset|redragon|fuxi/i.test(d.label)) || devs.find(d => !/webcam|noise-canceling|asus/i.test(d.label));
    if (melhor && melhor.deviceId !== stream.getAudioTracks()[0].getSettings().deviceId) {
      micId = melhor.deviceId; try { localStorage.setItem("atlasMic", micId); } catch {}
      return ligarMic();
    }
  }
  const trilha = stream.getAudioTracks()[0];
  $("mics").value = trilha.getSettings().deviceId || "";
  $("hudMic").textContent = trilha.label.slice(0, 28);
  audioCtx = audioCtx || new AudioContext();
  await audioCtx.resume();
  fonte = audioCtx.createMediaStreamSource(stream);
  proc = audioCtx.createScriptProcessor(4096, 1, 1);
  fonte.connect(proc); proc.connect(audioCtx.destination);
  const passo = 4096 / audioCtx.sampleRate * 1000;
  proc.onaudioprocess = ev => {
    const d = ev.inputBuffer.getChannelData(0);
    let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
    nivel = Math.sqrt(s / d.length);
    $("barra").style.width = Math.min(100, nivel * 900) + "%";
    if (falando && escutaAtiva) { vigiarInterrupcao(d, passo); return; }
    if (!usarWhisper || !escutaAtiva || ocupado || falando || performance.now() - fimFala < 1500) { gravando = false; buffers = []; return; }
    const pedaco = new Float32Array(d);
    if (nivel > LIMIAR) { falouMs += passo; silencioMs = 0; } else { silencioMs += passo; if (!gravando) falouMs = 0; }
    if (!gravando) {
      preRoll.push(pedaco); if (preRoll.length > 3) preRoll.shift();
      if (falouMs > 120) { gravando = true; buffers = [...preRoll]; setEstado("ouvindo"); }
    } else {
      buffers.push(pedaco);
      const dur = buffers.length * passo;
      if (silencioMs > 900 || dur > 15000) { gravando = false; const b = buffers; buffers = []; falouMs = 0; enviar(b); }
    }
  };
  setEstado("escutando");
}

// Reamostra para 16 kHz com filtro anti-aliasing (OfflineAudioContext), sem distorcer a voz.
async function para16k(lista) {
  const total = lista.reduce((n, b) => n + b.length, 0);
  const orig = audioCtx.createBuffer(1, total, audioCtx.sampleRate);
  let o = 0; for (const b of lista) { orig.copyToChannel(b, 0, o); o += b.length; }
  const off = new OfflineAudioContext(1, Math.ceil(total * 16000 / audioCtx.sampleRate), 16000);
  const s = off.createBufferSource(); s.buffer = orig; s.connect(off.destination); s.start();
  const out = (await off.startRendering()).getChannelData(0);
  let pico = 0; for (const v of out) pico = Math.max(pico, Math.abs(v));
  if (pico > 0 && pico < .5) { const g = .9 / pico; for (let i = 0; i < out.length; i++) out[i] *= g; }
  return out;
}

// ---------- cadastro da voz do dono ----------
const FRASES = [
  "Atlas, abre o navegador e pesquisa as novidades de hoje.",
  "Meu nome é " + "{usuario}" + " e esta é a minha voz.",
  "Atlas, cria um post para a loja com uma promoção de brinquedos.",
  "Quero que você reconheça só a minha voz, mais ninguém.",
];
let cadastroPasso = -1;
function proximaFrase() {
  const f = FRASES[cadastroPasso].replace("{usuario}", usuario);
  $("legenda").textContent = `(${cadastroPasso + 1}/${FRASES.length}) Leia em voz alta: “${f}”`;
  setEstado("aprendendo voz");
}
async function iniciarCadastro() {
  speechSynthesis.cancel();
  await falar("Vou aprender a sua voz. Leia em voz alta as frases que aparecerem na tela.");
  cadastroPasso = 0; proximaFrase();
}
$("minhaVoz").onclick = iniciarCadastro;

async function enviar(lista) {
  const pcm = await para16k(lista);
  if (pcm.length < 16000 * .5) { setEstado("escutando"); return; }
  ocupado = true;
  if (cadastroPasso >= 0) {
    const ultima = cadastroPasso === FRASES.length - 1;
    const fdt = new FormData(); fdt.append("audio", new Blob([pcm.buffer]), "voz.pcm");
    await fetch("/voz/cadastrar?ultima=" + ultima, { method: "POST", body: fdt });
    cadastroPasso++;
    if (cadastroPasso < FRASES.length) proximaFrase();
    else {
      cadastroPasso = -1; $("minhaVoz").classList.add("on");
      log("🔒 Voz cadastrada: agora só obedeço a você.", "acao");
      await falar("Pronto. Aprendi a sua voz. De agora em diante, só obedeço a você.");
      ultimaConversa = Date.now();
    }
    ocupado = false; setEstado(escutaAtiva ? "escutando" : "pausado"); return;
  }
  setEstado("transcrevendo");
  try {
    const fdt = new FormData(); fdt.append("audio", new Blob([pcm.buffer]), "fala.pcm");
    const r = await (await fetch("/ouvir", { method: "POST", body: fdt })).json();
    if (r.dono === false) $("legenda").textContent = `voz não reconhecida (${Math.round(r.similaridade * 100)}%) — ignorando`;
    else await ouviu(r.texto);
  } catch (e) { log("Erro ao ouvir: " + e, "acao"); }
  ocupado = false; if (estado !== "erro") setEstado(escutaAtiva ? "escutando" : "pausado");
}

// Se o microfone captou o alto-falante, o texto "ouvido" repete o que o Atlas falou: ignora.
let falasRecentes = [];
const palavras = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9 ]/g, "").split(/\s+/).filter(w => w.length > 2);
function ecoDoAtlas(texto) {
  const p = palavras(texto); if (!p.length) return false;
  return falasRecentes.some(f => { const set = new Set(palavras(f)); return p.filter(w => set.has(w)).length / p.length >= .6; });
}
async function ouviu(texto) {
  const limpo = (texto || "").trim();
  if (/(aprend|cadastr|reconhe)\w*\s+(a\s+)?minha\s+voz/i.test(limpo)) return iniciarCadastro();
  if (ecoDoAtlas(limpo)) { $("legenda").textContent = "(ignorei o eco da minha própria voz)"; return; }
  const chamou = new RegExp("\\b" + nomeIA + "\\b", "i").test(limpo);
  const emConversa = Date.now() - ultimaConversa < JANELA_CONVERSA;
  if (limpo.length > 2 && (chamou || emConversa)) await processar(limpo);
  else if (limpo.length > 2) $("legenda").textContent = `diga “${nomeIA}” para me chamar`;
}

// Reconhecimento de voz do próprio Edge (serviço da Microsoft): quase instantâneo.
// Se não estiver disponível ou falhar, volta para o Whisper local (mais lento).
let usarWhisper = true, reconhecedor = null;
function ligarReconhecimento() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  reconhecedor = new SR();
  reconhecedor.lang = "pt-BR"; reconhecedor.continuous = true; reconhecedor.interimResults = true;
  reconhecedor.onresult = ev => {
    if (!escutaAtiva || ocupado || falando) return;
    const r = ev.results[ev.results.length - 1], texto = r[0].transcript.trim();
    if (!r.isFinal) { setEstado("ouvindo"); $("legenda").textContent = texto; return; }
    ouviu(texto).then(() => { if (!ocupado && estado !== "erro") setEstado(escutaAtiva ? "escutando" : "pausado"); });
  };
  reconhecedor.onerror = ev => {
    if (["network", "not-allowed", "service-not-allowed", "language-not-supported"].includes(ev.error)) {
      log("Reconhecimento do Edge indisponível (" + ev.error + "), usando Whisper local.", "acao");
      reconhecedor = null; usarWhisper = true;
    }
  };
  reconhecedor.onend = () => { if (reconhecedor) try { reconhecedor.start(); } catch {} };
  try { reconhecedor.start(); usarWhisper = false; } catch { reconhecedor = null; }
}

async function processar(texto) {
  ocupado = true; log(texto, "eu"); $("legenda").textContent = "“" + texto + "”"; setEstado("pensando");
  try {
    const r = await (await fetch("/conversar", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto }) })).json();
    for (const a of r.acoes) log("⚙ " + a.acao + " → " + a.resultado, "acao");
    log(r.resposta, "ia"); $("legenda").textContent = r.resposta;
    await falar(r.resposta);
  } catch (e) { setEstado("erro"); log("Erro: " + e, "acao"); }
  ultimaConversa = Date.now();
  ocupado = false; setEstado(escutaAtiva ? "escutando" : "pausado");
}

// ================= interromper por voz ("Atlas, para") =================
// Enquanto ele fala, grava trechos bem altos; se for o dono dizendo "Atlas, para/chega/silêncio", corta a fala.
let intBuf = [], intGravando = false, intSilencio = 0, intChecando = false;
function vigiarInterrupcao(d, passo) {
  const alto = nivel > LIMIAR * 3;
  if (!intGravando && alto) { intGravando = true; intBuf = []; intSilencio = 0; }
  if (!intGravando) return;
  intBuf.push(new Float32Array(d));
  intSilencio = alto ? 0 : intSilencio + passo;
  if (intSilencio > 500 || intBuf.length * passo > 4000) {
    intGravando = false; const b = intBuf; intBuf = [];
    if (!intChecando && b.length * passo > 400) checarInterrupcao(b);
  }
}
async function checarInterrupcao(lista) {
  intChecando = true;
  try {
    const pcm = await para16k(lista);
    const fd = new FormData(); fd.append("audio", new Blob([pcm.buffer]), "int.pcm");
    const r = await (await fetch("/ouvir", { method: "POST", body: fd })).json();
    const t = (r.texto || "").toLowerCase();
    if (r.dono !== false && new RegExp(nomeIA, "i").test(t) && /(para|pare|chega|sil[eê]ncio|cala|stop|espera)/.test(t)) {
      pararDeFalar(); log("✋ interrompido", "acao"); $("legenda").textContent = "Ok, parei.";
    }
  } catch {}
  intChecando = false;
}

// ================= projetos do Claude (andamento ao vivo) =================
async function verProjetos() {
  try {
    const r = await (await fetch("/projetos")).json();
    $("painelProjetos").hidden = !r.projetos.length;
    $("projetos").innerHTML = r.projetos.map(p => `<div class="proj"><b>${p.nome}</b>
      <span class="st ${p.status.replace(" ", "-")}">${p.status === "em andamento" ? "⟳ criando" : p.status}</span>
      <div class="arqs">${p.arquivos.length} arquivo(s): ${p.arquivos.join(", ") || "…"}</div></div>`).join("");
    for (const m of r.lembretes || []) {
      const msg = `${usuario}, lembrete: ${m}`;
      log("⏰ " + msg, "ia"); $("legenda").textContent = msg;
      while (ocupado || falando) await new Promise(ok => setTimeout(ok, 500));
      await falar(msg); ultimaConversa = Date.now();
    }
    for (const n of r.novos_concluidos) {
      const resumo = (n.resposta || "").replace(/[*#`_>|]/g, "").trim();
      const msg = n.status !== "concluido"
        ? `${usuario}, a tarefa ${n.nome.replace(/-/g, " ")} deu erro. Quer que eu tente de novo?`
        : n.tipo === "tarefa" ? `${usuario}, tarefa concluída. ${resumo || "Pronto."}`
        : `${usuario}, terminei o projeto ${n.nome.replace(/-/g, " ")}. ${resumo || "Já está aberto no Antigravity."}`;
      log(msg, "ia"); $("legenda").textContent = msg;
      while (ocupado || falando) await new Promise(ok => setTimeout(ok, 500));
      await falar(msg); ultimaConversa = Date.now();
    }
  } catch {}
}
setInterval(verProjetos, 5000);

// ================= visão =================
let camTimer;
async function alternarCam() {
  const v = $("video");
  if (camLigada) {
    clearInterval(camTimer); v.srcObject && v.srcObject.getTracks().forEach(tr => tr.stop()); v.srcObject = null;
    camLigada = false; fetch("/camera/desligar", { method: "POST" });
  } else {
    try { v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } }); }
    catch (e) { log("Sem acesso à câmera (" + e.name + ")", "acao"); return; }
    camLigada = true;
    const tela = document.createElement("canvas"); tela.width = 640; tela.height = 480;
    camTimer = setInterval(() => {
      tela.getContext("2d").drawImage(v, 0, 0, 640, 480);
      tela.toBlob(b => { const f = new FormData(); f.append("foto", b, "cam.jpg"); fetch("/camera", { method: "POST", body: f }); }, "image/jpeg", .7);
    }, 2000);
  }
  v.classList.toggle("on", camLigada); $("cam").classList.toggle("on", camLigada);
  $("hudCam").textContent = camLigada ? "on" : "off";
  try { localStorage.setItem("atlasCam", camLigada ? "1" : "0"); } catch {}
}

// ================= controles (opcionais) =================
$("escuta").onclick = () => {
  escutaAtiva = !escutaAtiva; $("escuta").classList.toggle("on", escutaAtiva);
  $("hudEscuta").textContent = escutaAtiva ? "automática" : "pausada"; setEstado(escutaAtiva ? "escutando" : "pausado");
};
$("mudo").onclick = () => { vozLigada = !vozLigada; speechSynthesis.cancel(); $("mudo").classList.toggle("on", vozLigada); };
$("cam").onclick = alternarCam;
$("form").onsubmit = e => { e.preventDefault(); const v = $("txt").value.trim(); if (v && !ocupado) { $("txt").value = ""; processar(v); } };

// ================= inicialização =================
let c = null;
(async () => {
  try {
    c = await (await fetch("/config")).json();
    nomeIA = c.nome; usuario = c.usuario; $("nome").textContent = nomeIA.toUpperCase(); $("modelo").textContent = c.modelo;
    document.title = nomeIA;
  } catch {}
  await ligarMic();
  // O reconhecimento do Edge (nuvem) não sabe separar a sua voz das outras, então usamos só o Whisper local.
  usarWhisper = true;
  if (c && c.voz_cadastrada) $("minhaVoz").classList.add("on");
  try { if (localStorage.getItem("atlasCam") === "1") alternarCam(); } catch {}
  const h = new Date().getHours(), saud = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  const ola = `${saud}, ${usuario}. Sistemas online. É só me chamar pelo nome.`;
  $("legenda").textContent = ola; log(ola, "ia");
  setTimeout(async () => { await falar(ola); ultimaConversa = Date.now(); setEstado("escutando"); }, 700);
})();
// navegadores só liberam o áudio após um gesto; qualquer clique ou tecla destrava
addEventListener("pointerdown", () => audioCtx && audioCtx.resume(), { once: true });
</script>
